services:
  database:
    image: mongo:4.4
    container_name: nodegoat-db
    restart: unless-stopped
    user: mongodb
    volumes:
      - mongo_data:/data/db
    networks:
      - internal-net

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nodegoat-web
    restart: unless-stopped
    command: >
      sh -c "until node -e \"const s = require('net').createConnection(27017, 'database'); s.on('connect', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));\"; do
               echo 'Waiting for MongoDB...';
               sleep 2;
             done;
             echo 'MongoDB is reachable! Initializing database schema...';
             node artifacts/db-reset.js && npm start"
    environment:
      - MONGODB_URI=mongodb://database:27017/nodegoat
      - PORT=4000
    ports:
      - "4000:4000"
    depends_on:
      - database
    networks:
      - internal-net
      - public-net

networks:
  internal-net:
    driver: bridge
    internal: true
  public-net:
    driver: bridge

volumes:
  mongo_data:
